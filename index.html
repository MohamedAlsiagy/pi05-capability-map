<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>π0.5 Capability Map</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: a presenter app. Left: a menu of the five questions, each with its experiments. Right: one slide at a time.
   Every experiment slide has the same order: what we did, why, input prompt, video, result, what it means. */
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #111418; --ink-2: #39404a; --muted: #67707d; --line: #e0e3e9; --soft: #eef0f4;
  --c0: #3c4652;
  --f-kitchen: #1f6fdc; --f-spatial: #5d2aa3; --f-grocery: #22682c; --f-long: #b8327f; --f-l90: #67707d;
  --good: #1e7a46; --part: #a8650f; --bad: #b8322b; --good-bg: #e2f2e8; --part-bg: #f8eedb; --bad-bg: #f8e2e0;
  --screen: #16181c;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f12; --panel: #15181d; --ink: #eceff3; --ink-2: #c3c9d2; --muted: #8e98a6; --line: #262b33; --soft: #1c2027;
    --c0: #a3adba; --f-kitchen: #9ccaff; --f-spatial: #a77cf4; --f-grocery: #5cbd68; --f-long: #ff8fc8; --f-l90: #8e98a6;
    --good: #4fc488; --part: #e6a84a; --bad: #f07a70; --good-bg: #142a1e; --part-bg: #2d2313; --bad-bg: #2f1715;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f12; --panel: #15181d; --ink: #eceff3; --ink-2: #c3c9d2; --muted: #8e98a6; --line: #262b33; --soft: #1c2027;
  --c0: #a3adba; --f-kitchen: #9ccaff; --f-spatial: #a77cf4; --f-grocery: #5cbd68; --f-long: #ff8fc8; --f-l90: #8e98a6;
  --good: #4fc488; --part: #e6a84a; --bad: #f07a70; --good-bg: #142a1e; --part-bg: #2d2313; --bad-bg: #2f1715;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100%; }
.app.closed { grid-template-columns: 0 minmax(0, 1fr); }
/* menu */
.side { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 18px 12px 24px; min-width: 0; }
.app.closed .side { visibility: hidden; padding: 0; border: 0; }
.side-title { font: 800 19px/1.15 var(--display); padding: 0 8px 4px; letter-spacing: -0.01em; }
.side-sub { font-size: 12.5px; color: var(--muted); padding: 0 8px 14px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.nav-group { margin: 6px 0 10px; }
.nav-q { display: grid; grid-template-columns: 10px 1fr; gap: 10px; align-items: start; width: 100%; text-align: left; background: none; border: 0;
  padding: 8px; border-radius: 8px; cursor: pointer; }
.nav-q .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-top: 6px; }
.nav-q b { display: block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--c); font-family: var(--mono); font-weight: 500; }
.nav-q span { font-size: 14px; font-weight: 600; line-height: 1.3; }
.nav-x { display: grid; grid-template-columns: 34px 1fr; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 5px 8px 5px 28px;
  border-radius: 6px; cursor: pointer; font-size: 13.5px; color: var(--ink-2); }
.nav-x i { font: 500 12px/1.6 var(--mono); font-style: normal; color: var(--c); }
.nav-q:hover, .nav-x:hover { background: var(--soft); }
.nav-q.on, .nav-x.on { background: color-mix(in srgb, var(--c) 13%, transparent); }
.nav-x.on { color: var(--ink); font-weight: 600; }
.nav-q:focus-visible, .nav-x:focus-visible, .btn:focus-visible, .qcard:focus-visible, .xrow:focus-visible, .fk:focus-visible, .fki:focus-visible { outline: 2px solid var(--ink-2); outline-offset: 2px; }
/* stage */
.stage { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; height: 100%; }
.top { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
.crumb { font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.crumb b { color: var(--c); font-weight: 600; }
.btn { background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 13.5px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: 0.4; cursor: default; }
.scroll { overflow-y: auto; min-width: 0; }
.slide { max-width: 1260px; margin: 0 auto; padding: 28px 32px 40px; }
.foot { border-top: 1px solid var(--line); background: var(--panel); }
.progress { height: 3px; background: var(--soft); }
.progress span { display: block; height: 100%; background: var(--c); transition: width 0.25s; }
.foot-in { display: flex; align-items: center; gap: 12px; padding: 9px 20px; }
.count { font: 500 13px/1 var(--mono); color: var(--muted); }
.keys { margin-left: 12px; font-size: 12.5px; color: var(--muted); }
.fkey { display: flex; flex-wrap: wrap; gap: 2px; margin-left: auto; }
.fki { display: inline-flex; align-items: center; gap: 6px; background: none; border: 1px solid transparent; border-radius: 6px; padding: 4px 7px;
  cursor: pointer; font: 600 12.5px/1.2 var(--body); color: var(--f); }
.fki:hover { background: var(--soft); border-color: var(--line); }
.fki i { width: 9px; height: 9px; border-radius: 2.5px; background: var(--f); }
.fki.l90 i { background: none; box-shadow: inset 0 0 0 1.75px var(--f); border-radius: 50%; }
@media (max-width: 1440px) { .keys { display: none; } }
.keys kbd { font: 500 11.5px/1 var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; background: var(--soft); }
/* shared text */
h1, h2, h3 { font-family: var(--display); letter-spacing: -0.015em; text-wrap: balance; margin: 0; }
.kicker { font: 500 12.5px/1.4 var(--mono); letter-spacing: 0.04em; color: var(--muted); }
.chip { display: inline-block; font: 600 12px/1 var(--mono); letter-spacing: 0.05em; text-transform: uppercase; padding: 6px 9px; border-radius: 6px; white-space: nowrap; }
.chip.good { color: var(--good); background: var(--good-bg); }
.chip.part { color: var(--part); background: var(--part-bg); }
.chip.bad { color: var(--bad); background: var(--bad-bg); }
.chip.info { color: var(--ink-2); background: var(--soft); }
/* cover */
.cover h1 { font-size: clamp(32px, 4vw, 48px); line-height: 1.05; font-weight: 800; margin: 10px 0 16px; max-width: 22ch; }
.cover-answer { font-size: 19px; max-width: 64ch; color: var(--ink-2); margin: 0 0 26px; }
.cover-answer b { color: var(--ink); }
.qcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.qcard { text-align: left; background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 10px; padding: 14px 16px 16px;
  cursor: pointer; display: grid; gap: 8px; }
.qcard:hover { border-color: var(--c); }
.qcard .qn { font: 500 11.5px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--c); }
.qcard h3 { font-size: 19px; line-height: 1.2; }
.qcard p { margin: 0; font-size: 14.5px; color: var(--ink-2); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); }
.fact b { display: block; font: 800 28px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.fact span { font-size: 13.5px; color: var(--muted); }
/* question slide */
.qhead { display: grid; gap: 10px; margin-bottom: 22px; }
.qhead .qn { font: 500 13px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--c); }
.qhead h2 { font-size: clamp(28px, 3.4vw, 40px); line-height: 1.08; font-weight: 800; }
.qline { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.qline p { margin: 0; font-size: 18px; color: var(--ink-2); max-width: 70ch; }
.findings { list-style: none; margin: 0 0 26px; padding: 0; display: grid; gap: 10px; max-width: 900px; }
.findings li { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 8px; padding: 11px 14px; font-size: 16.5px; }
.findings b { font-variant-numeric: tabular-nums; }
.xlist-t { font: 500 12px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
.xlist { display: grid; gap: 8px; }
.xrow { display: grid; grid-template-columns: 48px minmax(0, 260px) minmax(0, 1fr) 20px; gap: 14px; align-items: center; text-align: left;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 11px 14px; cursor: pointer; }
.xrow:hover { border-color: var(--c); }
.xrow .id { font: 600 14px/1 var(--mono); color: var(--c); }
.xrow .nm { font-weight: 600; }
.xrow .rs { font-size: 14.5px; color: var(--ink-2); }
.xrow .ar { color: var(--muted); }
/* experiment slide */
.xhead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
.xid { font: 700 15px/1 var(--mono); color: var(--panel); background: var(--c); padding: 8px 10px; border-radius: 8px; }
.xhead h2 { font-size: clamp(26px, 3vw, 36px); line-height: 1.1; font-weight: 800; }
.xmeta { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 0 0 22px; font-size: 14.5px; color: var(--ink-2); }
.xmeta > span { display: inline-flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.xmeta b { font: 500 11.5px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.xbody { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 26px; align-items: start; }
.blk { display: grid; gap: 6px; }
.blk + .blk { margin-top: 18px; }
.blk h4 { margin: 0; font: 500 12px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--c); }
.blk p { margin: 0; font-size: 16.5px; }
.blk p.why { color: var(--ink-2); }
.prompts { display: grid; gap: 7px; }
.prompt { display: grid; gap: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px; }
.prompt small { font: 500 11.5px/1.2 var(--mono); color: var(--muted); letter-spacing: 0.02em; }
.prompt code { font: 500 14.5px/1.4 var(--mono); color: var(--ink); overflow-wrap: anywhere; }
.prompt code.none { color: var(--muted); font-style: italic; }
.media { display: grid; gap: 14px; }
.vid { display: grid; gap: 6px; }
video { width: 100%; height: auto; display: block; border-radius: 8px; background: var(--screen); }
.vcap { font-size: 14px; color: var(--ink-2); }
.offline { border: 1px dashed color-mix(in srgb, var(--c) 45%, var(--line)); border-radius: 10px; padding: 11px 14px; margin: -6px 0 20px;
  background: color-mix(in srgb, var(--c) 6%, var(--panel)); color: var(--ink-2); font-size: 15px; }
.offline b { color: var(--c); font: 600 12px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; margin-right: 8px; }
.xbody.solo { grid-template-columns: minmax(0, 1fr); }
.xbody.solo .cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 26px; align-items: start; }
.xbody.solo .blk + .blk { margin-top: 0; }
.xfoot { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 26px; margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--line); align-items: start; }
.groups { display: grid; gap: 16px; }
.group { display: grid; gap: 6px; }
.gt { font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.bar { display: grid; grid-template-columns: minmax(0, 240px) minmax(60px, 1fr) 70px; gap: 12px; align-items: center; font-size: 14.5px; }
.bar .lab { overflow-wrap: anywhere; }
.track { height: 12px; background: var(--soft); border-radius: 6px; overflow: hidden; }
.fill { display: block; height: 100%; background: var(--c); border-radius: 0 5px 5px 0; }
.bar.ref .fill { background: color-mix(in srgb, var(--muted) 55%, transparent); }
.bar.ref .lab { color: var(--muted); }
.bar.fb .fill { background: var(--f); }
.bar.fb.ref .fill { background: color-mix(in srgb, var(--f) 34%, var(--panel)); }
.bar.hatch .fill { background: repeating-linear-gradient(135deg, var(--f) 0 4px, color-mix(in srgb, var(--f) 35%, var(--panel)) 4px 7px); }
.val { font: 600 14px/1 var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.meaning { background: color-mix(in srgb, var(--c) 9%, var(--panel)); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); border-radius: 10px; padding: 16px 18px; }
.meaning h4 { margin: 0 0 8px; font: 500 12px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--c); }
.meaning p { margin: 0; font-size: 18px; font-weight: 600; line-height: 1.45; }
.matrix { border-collapse: separate; border-spacing: 4px; font: 500 13.5px/1.2 var(--mono); width: 100%; }
.matrix th { font: 600 12px/1.2 var(--body); color: var(--muted); padding: 4px; }
.matrix th.r { text-align: right; padding-right: 8px; white-space: nowrap; }
.matrix td { text-align: center; padding: 9px 4px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.matrix td.tr { outline: 2px solid var(--ink); outline-offset: -2px; font-weight: 700; }
.matrix td.na { color: var(--muted); }
.mx-wrap { overflow-x: auto; }
.mx-key { font-size: 13px; color: var(--muted); }
.chart text { fill: var(--muted); font: 12px var(--mono); }
.chart .gl { stroke: var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2); }
.legend i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--lc) 0 5px, transparent 5px 8px); }
.legend i.dot { background: repeating-linear-gradient(90deg, var(--lc) 0 2px, transparent 2px 5px); }
/* training data */
.tline { font-size: 18px; color: var(--ink-2); max-width: 72ch; margin: 0 0 20px; }
.envbox { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; font-size: 15.5px; color: var(--ink-2); max-width: 980px; }
.envbox b { color: var(--ink); }
.suites { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 18px 0; }
.suites th, .suites td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 15px; }
.suites th { font: 500 12px/1.2 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.suites tr:last-child td { border-bottom: 0; }
.suites tr.go-row { cursor: pointer; }
.suites tr.go-row:hover td { background: var(--soft); }
.suites td.num { font: 600 15px/1.3 var(--mono); font-variant-numeric: tabular-nums; }
.suites td.nm { font-weight: 600; white-space: nowrap; }
.suites td.nm small { display: block; font: 500 12px/1.4 var(--mono); color: var(--muted); }
.goal-wrap .scene-img { border: 2px solid var(--c); }
.why-note { border-left: 4px solid var(--c0); background: var(--panel); border-radius: 8px; padding: 11px 14px; font-size: 15.5px; max-width: 980px; }
.goal-wrap { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 24px; align-items: start; }
.scene-img { width: 100%; max-width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; border-radius: 10px; border: 1px solid var(--line); background: var(--screen); }
.tasklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.tasklist li { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
.tasklist .i { font: 600 12.5px/1 var(--mono); color: var(--muted); }
.tasklist q { font: 500 14.5px/1.4 var(--mono); quotes: "“" "”"; overflow-wrap: anywhere; }
.tasklist .d { font: 500 12px/1 var(--mono); color: var(--muted); white-space: nowrap; }
.scene-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 14px; }
.scene-card { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 10px; overflow: hidden; display: grid; align-content: start; }
.scene-card .scene-img { border: 0; border-radius: 0; }
.scene-card .sb { padding: 10px 12px 12px; display: grid; gap: 6px; }
.scene-card .rm { font: 600 12px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.scene-card q { font: 500 13.5px/1.4 var(--mono); quotes: "“" "”"; overflow-wrap: anywhere; display: block; }
.scene-card .d { font: 500 12px/1 var(--mono); color: var(--muted); }
.scene-card.shared { outline: 2px solid var(--c); outline-offset: -2px; }
.scene-card .two { font: 600 11.5px/1 var(--mono); color: var(--c); }
@media (max-width: 1080px) { .goal-wrap { grid-template-columns: minmax(0, 1fr); } }
/* method: computation and the overview table */
.steps { list-style: none; counter-reset: st; margin: 0; padding: 0; display: grid; gap: 10px; max-width: 1000px; }
.steps li { counter-increment: st; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 15.5px; }
.steps li::before { content: counter(st); font: 700 15px/30px var(--mono); text-align: center; width: 30px; height: 30px; border-radius: 8px; background: var(--soft); color: var(--ink); }
.steps b { color: var(--ink); }
.defs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; margin: 0 0 20px; }
.def { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--c0); border-radius: 10px; padding: 12px 14px; }
.def b { display: block; font: 700 17px/1.2 var(--display); margin-bottom: 4px; }
.def span { font-size: 14.5px; color: var(--ink-2); }
.timebox { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; margin: 0 0 18px; }
.tcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.tcard h3 { font-size: 17px; margin-bottom: 4px; }
.tcard .big { font: 800 30px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.tcard ul { margin: 8px 0 0; padding-left: 18px; font-size: 14.5px; color: var(--ink-2); display: grid; gap: 4px; }
.glance-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.glance { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.glance th, .glance td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.glance th { font: 500 11.5px/1.2 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); position: sticky; top: 0; background: var(--panel); }
.glance td.id { font: 700 13px/1.3 var(--mono); color: var(--c); white-space: nowrap; }
.glance td.n, .glance td.t { font: 500 13px/1.3 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.glance tr.qrow td { background: var(--soft); font: 600 12.5px/1.2 var(--body); color: var(--c); padding: 7px 10px; }
.glance tr.total td { font-weight: 700; border-top: 2px solid var(--line); }
.glance tr.go-row { cursor: pointer; }
.glance tr.go-row:hover td { background: color-mix(in srgb, var(--c) 7%, var(--panel)); }
/* scene families: each family's colour follows its name everywhere (text, bars, videos, tables) */
.f-kitchen { --f: var(--f-kitchen); } .f-spatial { --f: var(--f-spatial); } .f-grocery { --f: var(--f-grocery); } .f-long { --f: var(--f-long); } .f-l90 { --f: var(--f-l90); }
.fam { color: var(--f); font-weight: 600; white-space: nowrap; }
.fam::before { content: ""; display: inline-block; width: 0.6em; height: 0.6em; border-radius: 0.16em; background: var(--f); margin: 0 0.3em 0 0.08em; vertical-align: 0.04em; }
.fam.f-l90::before { background: none; box-shadow: inset 0 0 0 0.13em var(--f); border-radius: 50%; }

function bars(groups, xf) {  // bar colour = the family the runs come from (row label, group title, or the experiment's only family); slate = several pooled

    const gf = famOf(g.t) || xf;
    return `<div class="group"><div class="gt">${esc(g.t)}</div>${g.rows.map(([l, v, k, txt]) => {
      const f = famOf(l) || gf;
      return `<div class="bar ${k || ""}${f ? " fb" : ""}${f === "l90" ? " hatch" : ""}"${f ? ` style="--f: var(--f-${f})"` : ""}><span class="lab">${esc(l)}</span><span class="track"><span class="fill" style="width:${Math.max(0.8, 100 * v / (g.max || 100))}%"></span></span><span class="val">${txt || v + "%"}</span></div>`;
    }).join("")}</div>`;
  }).join("")}</div>`;
}

function matrix() {
  const head = `<tr><th></th>${MATRIX.tg.map(t => `<th>${t}</th>`).join("")}</tr>`;
  const body = MATRIX.objs.map((o, i) => `<tr><th class="r">${o}</th>${MATRIX.cells[i].map(c => {
    if (!c) return `<td class="na">—</td>`;
    const a = Math.round(8 + 42 * (c[0] + c[1]) / 20);
    return `<td class="${c[2] ? "tr" : ""}" style="background: color-mix(in srgb, var(--f-kitchen) ${a}%, var(--panel))">${c[0]} · ${c[1]}</td>`;
  }).join("")}</tr>`).join("");
  return `<div class="group"><div class="gt">Kitchen, successes out of 10: all objects · other objects removed</div><div class="mx-wrap"><table class="matrix">${head}${body}</table></div>
    <div class="mx-key">Outlined = a pair it was trained on. Darker = more successes.</div></div>`;
}

function chart() {
  const W = 620, H = 230, L = 40, R = 14, T = 12, B = 30;
  const x = i => L + (W - L - R) * i / 17, y = v => T + (H - T - B) * (1 - v / 100);
  const line = (vals, col, dash, w) => `<polyline fill="none" style="stroke: var(${col})" stroke-width="${w || 2.5}" ${dash ? `stroke-dasharray="${dash}"` : ""} points="${vals.map((v, i) => x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ")}"/>`;
  const grid = [0, 25, 50, 75, 100].map(v => `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}%</text>`).join("");
  const xt = [0, 4, 8, 12, 17].map(i => `<text x="${x(i)}" y="${H - 9}" text-anchor="middle">${i}</text>`).join("");
  return `<div class="group"><div class="gt">Kitchen images: how well the named object can be read back, by layer</div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Probe accuracy by layer">${grid}${xt}
      ${line(Array(18).fill(100), "--muted", "", 1.5)}${line(Array(18).fill(25), "--muted", "2 4", 1.5)}${line(F1.obj, "--f-kitchen")}${line(F1.unseen, "--f-kitchen", "7 5")}
      <text x="${x(14.5)}" y="${H - 9}" text-anchor="middle">layer →</text></svg>
    <div class="legend"><span><i style="background: var(--f-kitchen)"></i>action part: which object</span><span><i class="dash" style="--lc: var(--f-kitchen)"></i>same, for targets never seen with that object</span>
      <span><i style="background: var(--muted)"></i>the words themselves: 100%</span><span><i class="dot" style="--lc: var(--muted)"></i>chance (25%)</span></div></div>`;
}

function promptBox([label, text]) {
  const none = text === "";
  const isNote = text === SAME || label === "and";
  return `<div class="prompt"><small>${esc(label)}</small><code class="${none || isNote ? "none" : ""}">${none ? "(empty: no words at all)" : isNote ? esc(text) : "“" + esc(text) + "”"}</code></div>`;
}

function trainOverview() {
  const rows = SUITES.map(su => {
    const ts = TRAIN.filter(t => t[0] === su.id), n = new Set(ts.map(t => t[2])).size, d = ts.reduce((a, t) => a + t[3], 0);
    return `<tr class="go-row" data-go="${su.key}"><td class="nm">${famSpan(su.fam, FAMS[su.fam].name)}<small class="nt">${FAMS[su.fam].name === su.name ? FAMS[su.fam].suite : su.name}</small></td><td class="num">${ts.length}</td><td class="num">${n}</td><td class="num">${d}</td><td>${esc(su.differs)}</td></tr>`;
  }).join("");
  return `<div class="qhead"><span class="qn" style="color: var(--c0)">Before the questions</span><h2>What π0.5 was trained on</h2></div>
    <p class="tline">The official checkpoint is π0.5's general base model fine-tuned on LIBERO: <b>40 tasks</b> in 4 suites, <b>1,693 demonstrations</b>, 30,000 training steps. Everything else in this study is new to it. Each family keeps its colour on every slide.</p>
    <div class="envbox"><b>The environment.</b> LIBERO, a MuJoCo simulation of a Franka Panda arm at a table (grocery scenes: on the floor).
      π0.5 sees two cameras, a fixed scene camera and one on the wrist, plus the instruction; it does not get the arm's joint angles.
      Each step it outputs 7 numbers (move and turn the hand, open or close the gripper) and plans 10 steps at a time.</div>
    <table class="suites"><tr><th>Family · suite</th><th>Tasks</th><th>Scenes</th><th>Demos</th><th>What differs between its tasks</th></tr>${rows}</table>
    <div class="why-note"><b>Why it matters:</b> outside the shared kitchen, the scene alone almost says which task was trained there.
      That is what A1 found: with no words at all, 67–74% success in those scenes, but 10% in the kitchen. LIBERO-90's 90 tasks were not in the training data (E1 uses them).</div>`;
}

function suiteSlide(su) {
  const ts = TRAIN.map((t, i) => ({ t, i })).filter(o => o.t[0] === su.id);
  const fam = FAMS[su.fam];
  const head = `<div class="qhead"><span class="qn nt">Training data · ${su.name}</span><h2>${famSpan(su.fam, fam.name)}<span class="nt">${fam.name === su.name ? "" : " · " + su.name}: ${ts.length} tasks, ${su.scenes}</span></h2><p class="tline" style="margin:0">${esc(su.lead)}</p></div>`;
  if (su.id === "libero_goal") {
    return head + `<div class="goal-wrap"><img class="scene-img" src="${sceneImg(ts[0].t[2])}" alt="The LIBERO-Goal kitchen"><ol class="tasklist">${ts.map((o, k) =>
      `<li><span class="i">${k + 1}</span><q>${esc(o.t[1])}</q><span class="d">${o.t[3]} demos</span></li>`).join("")}</ol></div>`;
  }
  const groups = [];
  ts.forEach(o => { const g = groups.find(x => x.scene === o.t[2]); if (g) g.tasks.push(o.t); else groups.push({ scene: o.t[2], room: o.t[4], tasks: [o.t] }); });
  return head + `<div class="scene-grid">${groups.map((g, k) => `<div class="scene-card ${g.tasks.length > 1 ? "shared" : ""}">
      <img class="scene-img" src="${sceneImg(g.scene)}" alt="${esc(g.room || su.name + " scene " + (k + 1))}" loading="lazy">
      <div class="sb"><span class="rm nt">${esc(g.room || (su.id === "libero_spatial" ? "Arrangement " : "Scene ") + (k + 1))}</span>
      ${g.tasks.length > 1 ? `<span class="two">${g.tasks.length} tasks share this scene</span>` : ""}
      ${g.tasks.map(t => `<q>${esc(t[1])}</q><span class="d">${t[3]} demos</span>`).join("")}</div></div>`).join("")}</div>`;
}

function famKey() {
  return `<div class="famkey"><span class="fk-t">Colour = scene family</span>${FAM_ORDER.map(f => `<button class="fk${f === "l90" ? " l90" : ""}" type="button" data-go="${FAMS[f].go}" style="--f: var(--f-${f})"><i></i><b class="nt">${FAMS[f].name}</b><span class="nt">${FAMS[f].suite} · ${FAMS[f].what}</span></button>`).join("")}
    <span class="fk-n nt">Slate bars: several families pooled.</span></div>`;
}

function cover() {
  return `<div class="cover"><div class="kicker">LIBERO simulation · official π0.5 (pi05_libero) as released · 10,190 episodes · nothing trained</div>
    <h1>What does π0.5 really understand, and what can it do?</h1>
    <p class="cover-answer">It follows the instructions it was trained on, but a familiar scene pulls it to the task it learned there. <b>When a new instruction fails, the problem is mostly choosing what to act on, not the movement.</b></p>
    ${famKey()}
    <div class="qcards">${QUESTIONS.map(q => `<button class="qcard" type="button" data-go="${q.id}" style="--c: var(${q.c})"><span class="qn">${q.num}</span><h3>${esc(q.q)}</h3>
      <span><span class="chip ${q.verdict[0]}">${q.verdict[1]}</span></span><p>${esc(q.answer)}</p></button>`).join("")}</div>
    <div class="facts"><div class="fact"><b>40</b><span>tasks it was trained on (1,693 demos)</span></div><div class="fact"><b>10,190</b><span>simulated episodes</span></div><div class="fact"><b>28</b><span>experiments</span></div>
      <div class="fact"><b>10</b><span>runs per setup, same starting scenes</span></div><div class="fact"><b>6.4 h</b><span>on 2 GPUs (≈ 24 h in series)</span></div><div class="fact"><b>0</b><span>models trained or fine-tuned</span></div></div></div>`;
}

function question(q) {
  return `<div class="qhead"><span class="qn">${q.num}</span><h2>${esc(q.q)}</h2><div class="qline"><span class="chip ${q.verdict[0]}">${q.verdict[1]}</span><p>${esc(q.answer)}</p></div></div>
    <ul class="findings">${q.findings.map(f => `<li>${f}</li>`).join("")}</ul>
    <div class="xlist-t">Experiments</div>
    <div class="xlist">${q.exps.map(x => `<button class="xrow" type="button" data-go="${x.id}"><span class="id">${x.id}</span><span class="nm">${esc(x.name)}</span><span class="rs">${esc(x.sum)}</span><span class="ar">→</span></button>`).join("")}</div>`;
}

function experiment(x) {
  const media = x.videos ? `<div class="media">${x.videos.map(v => `<div class="vid"><video src="${v.src}" poster="${v.poster}" muted autoplay loop playsinline controls preload="auto"></video><span class="vcap">${famSpan(v.fam, v.label)} · ${esc(v.cap)}</span></div>`).join("")}</div>` : "";
  const result = x.matrix ? matrix() : x.chart ? chart() : x.result ? bars(x.result, soleFam(x.id)) : "";
  const text = `<div class="blk"><h4>What we did</h4><p>${esc(x.did)}</p></div>
      <div class="blk"><h4>Why</h4><p class="why">${esc(x.why)}</p></div>
      <div class="blk"><h4>Input prompt${x.prompts.length > 1 ? "s" : ""}</h4><div class="prompts">${x.prompts.map(promptBox).join("")}</div>${x.promptNote ? `<span class="vcap">${esc(x.promptNote)}</span>` : ""}</div>`;
  const tm = timeOf(x.id);
  const when = !tm ? "" : x.id === "F3" ? "computed together with F1" : tm.offline ? hm(tm.dual) : `${hm(tm.dual)} on 2 GPUs · ${hm(tm.series)} in series`;
  return `<div class="xhead"><span class="xid">${x.id}</span><h2>${esc(x.name)}</h2></div>
    <div class="xmeta"><span><b>Scenes</b>${famsOf(x.id).map(f => famSpan(f, FAMS[f].short)).join(" ")}</span><span><b>Size</b>${esc(x.n)}</span>${when ? `<span><b>Time</b>${when}</span>` : ""}</div>
    ${x.videos ? "" : `<div class="offline"><b>No video</b>${esc(x.offline)}</div>`}
    <div class="xbody ${x.videos ? "" : "solo"}">${x.videos ? `<div>${text}</div>${media}` : `<div class="cols2">${text}</div>`}</div>
    <div class="xfoot"><div class="blk"><h4>Result</h4>${result}</div><div class="meaning"><h4>What it means</h4><p>${esc(x.meaning)}</p></div></div>`;
}

function compute() {
  return `<div class="qhead"><span class="qn" style="color: var(--c0)">Method</span><h2>How a result is computed</h2></div>
    <div class="defs"><div class="def"><b>Episode</b><span>One run in the simulator: one task, one starting scene, until the goal is reached or the step limit. It gives one success or failure. About 3–20 seconds of compute.</span></div>
      <div class="def"><b>Setup</b><span>One task under one condition (e.g. “bowl on the stove, no words”): usually 10 episodes from 10 different starting scenes.</span></div>
      <div class="def"><b>Offline experiment</b><span>A3, F1–F3: the robot never moves. π0.5 is only given saved camera images and asked for actions, or its internal state is read.</span></div></div>
    <ol class="steps">
      <li><span><b>Starting scene.</b> For episode <i>e</i> of task <i>T</i> the random generator is seeded from “T/e”; LIBERO then places the objects at random inside the task's allowed areas. So every version of a task (normal, no words, swapped, recoloured…) starts from the <b>same 10 scenes</b>.</span></li>
      <li><span><b>Running.</b> π0.5 gets both camera images and the prompt and returns 10 actions; 5 are executed, then it is asked again. At most 300 steps (LIBERO-10: 520, LIBERO-90: 400).</span></li>
      <li><span><b>Success.</b> After every step the simulator checks the task's goal from its task file, e.g. “the bowl is on the stove's cooking area” or “the top drawer is open”. No person or model judges it. The episode stops at success.</span></li>
      <li><span><b>Extra measurements.</b> Logged every step: the first object grasped, objects touched, where the gripper started to close, the hand's path, object positions at start and end, and whether another trained task's goal came true.</span></li>
      <li><span><b>Numbers.</b> Rate = successes ÷ episodes, with a 95% range. A condition is compared with the normal run start by start, counting only the starts where one of the two succeeded and the other did not (McNemar test). Rates are pooled per suite; nothing is claimed from one task's 10 episodes.</span></li>
    </ol>`;
}

function glance() {
  let rows = "";
  QUESTIONS.forEach(q => {
    rows += `<tr class="qrow" style="--c: var(${q.c})"><td colspan="9">${q.num} · ${esc(q.q)}</td></tr>`;
    q.exps.forEach(x => {
      const g = GLANCE[x.id] || ["", "", ""], tm = timeOf(x.id), n = TIMES.episodes[x.id];
      rows += `<tr class="go-row" data-go="${x.id}" style="--c: var(${q.c})"><td class="id">${x.id}</td><td>${esc(x.name)}</td><td class="sc">${famDots(x.id)}</td><td>${esc(g[0])}</td><td>${esc(g[1])}</td>
        <td class="n">${n ? n.toLocaleString("en-US") : "offline"}</td><td>${esc(g[2])}</td>
        <td class="t">${tm ? (tm.offline && x.id === "F3" ? "with F1" : hm(tm.dual)) : ""}</td><td class="t">${tm ? (tm.offline && x.id === "F3" ? "with F1" : hm(tm.series)) : ""}</td></tr>`;
    });
  });
  const eps = Object.values(TIMES.episodes).reduce((a, b) => a + b, 0);
  rows += `<tr class="total"><td></td><td>All robot runs</td><td></td><td></td><td></td><td class="n">${eps.toLocaleString("en-US")}</td><td></td><td class="t">${hm(TIMES.wall)}</td><td class="t">${hm(SERIES_TOTAL)}</td></tr>`;
  const offline = TIMES.offline.A3 + TIMES.offline.F1 + TIMES.offline.F2 + TIMES.colours;
  return `<div class="qhead"><span class="qn" style="color: var(--c0)">Method</span><h2>All experiments: tasks, episodes and time</h2></div>
    <div class="timebox">
      <div class="tcard"><h3>As run: 2 GPUs</h3><div class="big">${hm(TIMES.total)}</div><ul>
        <li>2 RTX 4090s, 4 copies of π0.5 and the simulator in parallel</li>
        <li>13:26 → 19:52. Robot runs until 19:33: ${hm(TIMES.wall)} for ${eps.toLocaleString("en-US")} episodes (≈ ${Math.round(eps / TIMES.wall)} per minute)</li>
        <li>A3 (${TIMES.offline.A3} min) ran alongside; colour check ${Math.round(TIMES.colours)} min; F1 and F2 in parallel at the end (${TIMES.offline.F2} min)</li></ul></div>
      <div class="tcard"><h3>In series: one copy, back to back</h3><div class="big">${hm(SERIES_TOTAL + offline)}</div><ul>
        <li>Robot runs: ${hm(SERIES_TOTAL)} (sum of every episode's time)</li>
        <li>Offline parts: ${hm(offline)} (A3, colour check, F1, F2)</li>
        <li>The parallel run was ${SPEEDUP.toFixed(1)}× faster. Episode times were measured with 4 copies sharing 2 GPUs; one copy alone steps about 20% faster.</li></ul></div>
    </div>
    <div class="glance-wrap"><table class="glance"><tr><th>Exp</th><th>Name</th><th>Scenes</th><th>Tasks used</th><th>Per task</th><th style="text-align:right">Episodes</th><th>What is counted</th><th style="text-align:right">2 GPUs</th><th style="text-align:right">In series</th></tr>${rows}</table></div>
    <p class="vcap" style="margin-top:8px">“2 GPUs” = the experiment's share of the parallel run (its series time ÷ ${SPEEDUP.toFixed(1)}). Times ${esc(TIMES.note)}. The 20-task set = 8 kitchen, 6 grocery and 6 spatial tasks. One-object tasks = the 28 trained tasks with a single object to grasp.</p>`;
}

const app = document.getElementById("app"), slideEl = document.getElementById("slide"), side = document.getElementById("side");

side.innerHTML = famTag(`<div class="side-title">π0.5 capability map</div><div class="side-sub">Official pi05_libero · LIBERO · nothing trained</div>
  <button class="nav-q" type="button" data-go="overview" style="--c: var(--c0)"><i class="dot"></i><span><b>Start</b>Overview</span></button>
  <div class="nav-group" style="--c: var(--c0)"><button class="nav-q" type="button" data-go="training"><i class="dot"></i><span><b>Training data</b>40 tasks, 30 scenes</span></button>
    ${SUITES.map(su => `<button class="nav-x" type="button" data-go="${su.key}" style="--c: var(--f-${su.fam})"><i class="sw"></i><span class="nt"><b>${FAMS[su.fam].name}</b><small>${FAMS[su.fam].name === su.name ? FAMS[su.fam].suite : su.name}</small></span></button>`).join("")}</div>
  ${QUESTIONS.map(q => `<div class="nav-group" style="--c: var(${q.c})"><button class="nav-q" type="button" data-go="${q.id}"><i class="dot"></i><span><b>${q.num}</b>${esc(q.short)}</span></button>
    ${q.exps.map(x => `<button class="nav-x" type="button" data-go="${x.id}"><i>${x.id}</i><span>${esc(x.name)}</span></button>`).join("")}</div>`).join("")}
  <div class="nav-group" style="--c: var(--c0)"><button class="nav-q" type="button" data-go="compute"><i class="dot"></i><span><b>Method</b>How it was tested</span></button>
    <button class="nav-x" type="button" data-go="compute"><i>1</i><span>How a result is computed</span></button>
    <button class="nav-x" type="button" data-go="glance"><i>2</i><span>All experiments and time</span></button></div>`);
document.getElementById("fkey").innerHTML = FAM_ORDER.map(f => `<button class="fki${f === "l90" ? " l90" : ""}" type="button" data-go="${FAMS[f].go}" style="--f: var(--f-${f})" title="${FAMS[f].name} · ${FAMS[f].suite}"><i></i>${FAMS[f].short}</button>`).join("");

let cur = 0;
function show(i) {
  cur = Math.max(0, Math.min(SLIDES.length - 1, i));
  const s = SLIDES[cur];
  slideEl.style.setProperty("--c", `var(${s.c})`);
  document.querySelector(".stage").style.setProperty("--c", `var(${s.c})`);
  slideEl.innerHTML = famTag(s.kind === "cover" ? cover() : s.kind === "train" ? trainOverview() : s.kind === "suite" ? suiteSlide(s.su)
    : s.kind === "question" ? question(s.q) : s.kind === "exp" ? experiment(s.x) : s.kind === "compute" ? compute() : glance());
  slideEl.classList.remove("enter"); void slideEl.offsetWidth; slideEl.classList.add("enter");
  document.getElementById("crumb").innerHTML = s.crumb;
  document.getElementById("count").textContent = `${cur + 1} / ${SLIDES.length}`;
  document.getElementById("prog").style.width = `${100 * (cur + 1) / SLIDES.length}%`;
  document.getElementById("prev").disabled = cur === 0;
  document.getElementById("next").disabled = cur === SLIDES.length - 1;
  side.querySelectorAll("[data-go]").forEach(b => b.classList.toggle("on", b.dataset.go === s.key || (s.kind === "exp" && b.dataset.go === s.q.id && b.classList.contains("nav-q"))));
  const active = side.querySelector(`[data-go="${s.key}"]`);
  if (active) active.scrollIntoView({ block: "nearest" });
  slideEl.querySelectorAll("video").forEach(v => {
    v.muted = true;
    const start = () => { const p = v.play(); if (p) p.catch(() => {}); };
    start();
    v.addEventListener("canplay", start, { once: true });
  });
  document.getElementById("scroll").scrollTop = 0;
  try { history.replaceState(null, "", "#" + s.key); localStorage.setItem("pi05-map-slide", s.key); } catch (e) {}
  if (window.matchMedia("(max-width: 860px)").matches) app.classList.add("closed");
}
const go = key => { const i = SLIDES.findIndex(s => s.key === key); if (i >= 0 && i !== cur) show(i); };
window.addEventListener("hashchange", () => go(location.hash.slice(1)));

document.addEventListener("click", e => { const t = e.target.closest("[data-go]"); if (t) go(t.dataset.go); });
document.getElementById("prev").onclick = () => show(cur - 1);
document.getElementById("next").onclick = () => show(cur + 1);
document.getElementById("menu").onclick = () => app.classList.toggle("closed");
const toggleTheme = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("pi05-map-theme", root.dataset.theme); } catch (e) {}
};
const toggleFull = () => { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else document.documentElement.requestFullscreen().catch(() => {}); };
document.getElementById("theme").onclick = toggleTheme;
document.getElementById("full").onclick = toggleFull;
document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (["ArrowRight", "PageDown", " "].includes(e.key) && e.target.tagName !== "VIDEO") { e.preventDefault(); show(cur + 1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); show(cur - 1); }
  else if (e.key === "Home") show(0);
  else if (e.key === "End") show(SLIDES.length - 1);
  else if (e.key === "f" || e.key === "F") toggleFull();
  else if (e.key === "m" || e.key === "M") app.classList.toggle("closed");
  else if (e.key === "t" || e.key === "T") toggleTheme();
});
try { const t = localStorage.getItem("pi05-map-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
let startKey = location.hash.slice(1);
if (!startKey) { try { startKey = localStorage.getItem("pi05-map-slide") || ""; } catch (e) {} }
const startIndex = SLIDES.findIndex(s => s.key === startKey);
show(startIndex >= 0 ? startIndex : 0);
</script>
</body>
</html>
